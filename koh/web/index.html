<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HALLS</title><link rel="stylesheet" href="/web/site.css"><script defer src="/web/app.js"></script></head>
<body><main>
<header class="intro"><h1>HALLS</h1></header>
<div class="timeline" id="submission" hidden>
<section class="step" id="step-1" data-state="active"><span class="step-badge" id="badge-1" aria-label="步骤 1">1</span><div class="step-body"><h2>前往查看游戏介绍</h2><div class="step-actions"><a class="action" id="intro-link" href="https://halls.z4ck.dev/about" target="_blank" rel="noopener"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></svg><span>HALLS 官网 · 游戏介绍</span></a><button class="ack" id="intro-confirm" type="button">我已知晓</button></div></div></section>
<section class="step" id="step-2" data-state="locked"><span class="step-badge" id="badge-2" aria-label="步骤 2，未解锁">2</span><div class="step-body"><h2>前往游戏下载</h2><div class="step-actions"><a class="action" id="download-link" href="https://halls.z4ck.dev/download" target="_blank" rel="noopener" aria-disabled="true" tabindex="-1"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M5 17v4h14v-4"/></svg><span>HALLS 官网 · 游戏下载</span></a><button class="ack" id="download-confirm" type="button" disabled>我已下载</button></div></div></section>
<section class="step" id="step-3" data-state="locked"><span class="step-badge" id="badge-3" aria-label="步骤 3，未解锁">3</span><div class="step-body"><h2>上传通关凭证</h2><form id="proof-form"><fieldset id="upload-fields" disabled><label class="name-box" for="player-name">玩家名字<input id="player-name" name="name" maxlength="32" autocomplete="nickname" placeholder="输入展示名字" required></label><label class="file-box" for="proof-file"><input id="proof-file" type="file" accept=".hproof" required><span id="file-label">选择 .hproof 文件</span><small>最大 15 MiB</small></label><button class="submit" id="submit" type="submit">上传凭证 <span aria-hidden="true">→</span></button></fieldset></form><p class="status" id="upload-message" aria-live="polite"></p></div></section>
<section class="step" id="step-4" data-state="locked"><span class="step-badge" id="badge-4" aria-label="步骤 4，未解锁">4</span><div class="step-body"><h2>自动评判</h2><div id="result" aria-live="polite">上传后自动开始评判。</div><div class="result-actions"><button class="retry" id="retry" type="button" hidden>重试评判</button><button class="new-submission" id="new-submission" type="button" hidden>提交新的凭证</button></div><p class="status error" id="new-message" aria-live="polite"></p></div></section>
</div><section class="history" id="history" hidden><details><summary>历史提交</summary><div id="history-list"></div></details></section><p class="status error" id="page-error" aria-live="polite"></p>
</main></body></html>
