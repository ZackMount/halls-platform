# Include in nginx http {}. Replace records.example.com and certificate paths.
limit_req_zone $binary_remote_addr zone=halls_read:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=halls_write:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=halls_conn:10m;
limit_conn_zone $server_name zone=halls_upload_conn:1m;
server {
 listen 443 ssl;
 server_name records.example.com;
 error_page 404 =404 /_empty_404;
 location = /_empty_404 {
  internal;
  alias /opt/halls/empty-404;
  default_type "";
  etag off;
  if_modified_since off;
  access_log off;
  add_header Cache-Control "no-store" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
 }
 ssl_certificate /etc/letsencrypt/live/records.example.com/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/records.example.com/privkey.pem;
 client_max_body_size 15m;
 client_body_timeout 15s;
 client_header_timeout 10s;
 send_timeout 20s;
 limit_conn halls_conn 12;
 limit_req_status 429;
 add_header Strict-Transport-Security "max-age=31536000" always;
 location ^~ /api/submit/ {
  access_log off;
  error_log /dev/null;
  limit_req zone=halls_write burst=3 nodelay;
  limit_conn halls_conn 2;
  limit_conn halls_upload_conn 8;
  proxy_request_buffering on;
  proxy_pass http://127.0.0.1:8770;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_read_timeout 35s;
 }
 location = /admin { access_log off; return 404; }
 location ^~ /admin/ { access_log off; return 404; }
 location ^~ /api/admin { access_log off; return 404; }
 location = /api/uploads {
  limit_req zone=halls_write burst=3 nodelay;
  limit_conn halls_conn 2;
  limit_conn halls_upload_conn 8;
  proxy_request_buffering on;
  proxy_pass http://127.0.0.1:8770;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_read_timeout 35s;
 }
 location = /api/previews {
  limit_req zone=halls_write burst=3 nodelay;
  limit_conn halls_conn 2;
  limit_conn halls_upload_conn 8;
  proxy_request_buffering on;
  proxy_pass http://127.0.0.1:8770;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_read_timeout 35s;
 }
 location / {
  limit_req zone=halls_read burst=40 nodelay;
  proxy_pass http://127.0.0.1:8770;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_read_timeout 35s;
 }
}
server {
 listen 80; server_name records.example.com;
 error_page 404 =404 /_empty_404;
 location = /_empty_404 {
  internal;
  alias /opt/halls/empty-404;
  default_type "";
  etag off;
  if_modified_since off;
  access_log off;
  add_header Cache-Control "no-store" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
 }
 location = /admin { access_log off; return 404; } location ^~ /admin/ { access_log off; return 404; } location ^~ /api/admin { access_log off; return 404; } location / { return 301 https://$host$request_uri; } }
